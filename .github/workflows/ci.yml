name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel in-flight runs on the same ref when a new push lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin the upstream topo-core / topo-lang / topo-v8 refs this build is
  # tested against. Bump whenever a new compatible tag ships.
  TOPO_CORE_REF: main
  TOPO_LANG_REF: main
  TOPO_V8_REF: main

jobs:
  build-and-test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v5

      - name: Install build deps (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build

      - name: Install build deps (macos)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Set up Node.js 22 (for topo-extract-typescript + contract-pass tools)
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Export GHA cache env (for vcpkg x-gha backend)
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          # Matches the `builtin-baseline` pinned in vcpkg.json. Bump both
          # together when refreshing the vcpkg snapshot.
          vcpkgGitCommitId: "56bb2411609227288b70117ead2c47585ba07713"

      # Cache the upstream Topo install (topo-core + topo-lang + topo-v8)
      # so PRs don't re-build them every time. Keyed on the three pinned
      # refs so bumping any of them invalidates the cache.
      - name: Cache upstream topo install
        id: topo-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/topo-install
          # v5: topo-v8's regex symbol extractor now emits one symbol per
          # declarator for multi-declarator exports. The install is keyed on the
          # literal ref `main`, so a topo-v8 behavior change does not invalidate
          # it on its own — bump the suffix to force a rebuild that picks up the
          # fix (else the stale cached topo-v8 fails ExportMultiDeclarator).
          key: topo-core-${{ env.TOPO_CORE_REF }}-lang-${{ env.TOPO_LANG_REF }}-v8-${{ env.TOPO_V8_REF }}-${{ matrix.os }}-v5

      - name: Build & install topo-core (zero-LLVM, lang-less)
        if: steps.topo-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${TOPO_CORE_REF}" \
              https://github.com/topo-lang/topo-core.git \
              "${RUNNER_TEMP}/topo-core-src"
          cmake -S "${RUNNER_TEMP}/topo-core-src" \
                -B "${RUNNER_TEMP}/topo-core-build" \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
                -DTOPO_ENABLE_LLVM=OFF
          cmake --build "${RUNNER_TEMP}/topo-core-build" --target install

      - name: Build & install topo-lang
        if: steps.topo-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${TOPO_LANG_REF}" \
              https://github.com/topo-lang/topo-lang.git \
              "${RUNNER_TEMP}/topo-lang-src"
          cmake -S "${RUNNER_TEMP}/topo-lang-src" \
                -B "${RUNNER_TEMP}/topo-lang-build" \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake"
          cmake --build "${RUNNER_TEMP}/topo-lang-build" --target install

      # Re-install topo-core to flip TOPO_CORE_WITH_LANG ON now that
      # topo-lang is discoverable in the prefix. This wires lib/Build +
      # lib/Transpile into the topo-core install set (V8Codegen depends
      # on TopoTranspile).
      - name: Re-install topo-core (with-lang)
        if: steps.topo-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S "${RUNNER_TEMP}/topo-core-src" \
                -B "${RUNNER_TEMP}/topo-core-build" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install"
          cmake --build "${RUNNER_TEMP}/topo-core-build" --target install

      - name: Build & install topo-v8
        if: steps.topo-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${TOPO_V8_REF}" \
              https://github.com/topo-lang/topo-v8.git \
              "${RUNNER_TEMP}/topo-v8-src"
          cmake -S "${RUNNER_TEMP}/topo-v8-src" \
                -B "${RUNNER_TEMP}/topo-v8-build" \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake"
          cmake --build "${RUNNER_TEMP}/topo-v8-build" --target install

      - name: Stage topo-v8 contract-pass tools (deterministic)
        # The Node contract-pass tools live in topo-v8's source tree (not its
        # install set), and topo-install is cached while this tree is not — so
        # on a cache hit the topo-v8 source was never cloned. Stage the tools
        # (independent of the install cache) by sparse-cloning just
        # topo-v8/tools when absent, so they are present on every run and the
        # contract-pass transforms never silently skip. Runs on every OS — the
        # npm install moved out of the CMake POST_BUILD into a dedicated
        # workflow step below (npm.cmd can't run from a POST_BUILD on
        # windows-2022), so the transforms stage + test on Windows too.
        run: |
          set -euo pipefail
          if [ ! -d "${RUNNER_TEMP}/topo-v8-tools/visibility-transform" ]; then
            git clone --depth 1 --branch "${TOPO_V8_REF}" --filter=blob:none --sparse \
                https://github.com/topo-lang/topo-v8.git "${RUNNER_TEMP}/topo-v8-tools-src"
            git -C "${RUNNER_TEMP}/topo-v8-tools-src" sparse-checkout set tools
            mkdir -p "${RUNNER_TEMP}/topo-v8-tools"
            cp -R "${RUNNER_TEMP}/topo-v8-tools-src/tools/." "${RUNNER_TEMP}/topo-v8-tools/"
          fi
          test -d "${RUNNER_TEMP}/topo-v8-tools/visibility-transform"

      - name: Configure topo-lang-typescript
        run: |
          # The contract-pass tools are staged from topo-v8/tools (the step
          # above) on every OS. REQUIRE them everywhere: a missing tools tree is
          # a hard FAIL, not a silent skip (skip != pass). The npm install that
          # populates each tool's node_modules runs after Build (npm.cmd can't
          # run from the CMake POST_BUILD on windows-2022).
          if [ ! -d "${RUNNER_TEMP}/topo-v8-tools/visibility-transform" ]; then
            echo "::error::topo-v8-tools missing (visibility-transform absent) — contract-pass transforms would silently skip"
            exit 1
          fi
          cmake -S . -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install" \
              -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
              -DTOPO_LANG_TYPESCRIPT_BUILD_TESTS=ON \
              -DTOPO_V8_TOOLS_DIR="${RUNNER_TEMP}/topo-v8-tools" \
              -DTOPO_LANG_TYPESCRIPT_REQUIRE_CONTRACT_PASSES=ON

      - name: Build
        run: cmake --build build

      - name: npm install contract-pass transforms (build-dir copies)
        # POST_BUILD copies each transform into build/topo-build/<tool>/ but no
        # longer runs npm (npm.cmd exits 127 from a CMake POST_BUILD on
        # windows-2022). Populate node_modules/typescript here so the
        # ts-tool-smoke Node tests can `import 'typescript'` at ctest time.
        run: |
          set -euo pipefail
          for tool in visibility-transform containment-guard-transform stage-assert-transform; do
            dir="build/topo-build/${tool}"
            test -f "${dir}/package.json" || { echo "::error::expected staged transform package.json missing: ${dir}/package.json"; exit 1; }
            # cd into the tool dir rather than `npm install --prefix <dir>`: on
            # windows-2022 npm --prefix still resolves package.json from the CWD
            # (repo root, which has no package.json) and fails ENOENT, while it
            # works on POSIX. cd makes package.json + node_modules resolution
            # unambiguous on all three OSes.
            ( cd "${dir}" && npm install --omit=dev --no-audit --no-fund )
          done

      - name: npm install topo-extract-typescript (build-dir copy)
        # The CMake topo-extract-typescript-stage target copies the extractor
        # tool body into build/topo-build/topo-extract-typescript-tool but no
        # longer runs npm (npm exits 127 from a CMake command on windows-2022,
        # the same root cause as the contract-pass transforms). Populate
        # node_modules/typescript here so the extractor smoke test
        # (`node --test smoke.test.mjs`, which spawns `node index.mjs`) can
        # import 'typescript' at ctest time. Runs on all three OSes.
        run: |
          set -euo pipefail
          dir="build/topo-build/topo-extract-typescript-tool"
          test -f "${dir}/package.json" || { echo "::error::expected staged extractor package.json missing: ${dir}/package.json"; exit 1; }
          ( cd "${dir}" && npm install --omit=dev --no-audit --no-fund )

      - name: Test
        run: |
          # Windows: the input-trust suite spawns the MinGW-linked
          # topo-build-typescript.exe; a stale libstdc++-6.dll earlier on PATH
          # makes it fail to load (0xC0000139). Put the build-time gcc bin dir
          # FIRST so the matching runtime resolves; the spawned child inherits it.
          if [ "$RUNNER_OS" = "Windows" ]; then
            cxx=$(grep -m1 '^CMAKE_CXX_COMPILER:' build/CMakeCache.txt | cut -d= -f2)
            if [ -n "$cxx" ]; then
              export PATH="$(cygpath -u "$(dirname "$cxx")"):${PATH}"
            fi
          fi
          ctest --test-dir build --output-on-failure --timeout 120 --no-tests=error

      # Smoke test: install topo-lang-typescript, then verify a downstream
      # find_package(topo-lang-typescript CONFIG REQUIRED) resolves and
      # links cleanly against the topo::lang-typescript::TopoTypeScriptInit
      # target.
      - name: Install topo-lang-typescript
        run: cmake --install build --prefix "${RUNNER_TEMP}/lang-typescript-install"

      - name: find_package smoke
        run: |
          mkdir -p "${RUNNER_TEMP}/find-package-smoke"
          cd "${RUNNER_TEMP}/find-package-smoke"
          cat > vcpkg.json <<'JSON'
          {
            "name": "topo-lang-typescript-smoke",
            "version-string": "0.0.1",
            "builtin-baseline": "56bb2411609227288b70117ead2c47585ba07713",
            "dependencies": ["nlohmann-json", "tomlplusplus"]
          }
          JSON
          cat > CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.20)
          project(lang-typescript-find-package-smoke LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 17)
          find_package(topo-lang-typescript CONFIG REQUIRED)
          add_executable(smoke smoke.cpp)
          target_link_libraries(smoke PRIVATE topo::lang-typescript::TopoTypeScriptInit)
          if(MINGW)
              target_link_options(smoke PRIVATE -static -static-libgcc -static-libstdc++)
          endif()
          CMAKE
          cat > smoke.cpp <<'CPP'
          #include "TypeScriptInitTemplateProvider.h"
          #include <cstdio>
          int main() {
              topo::lang::TypeScriptInitTemplateProvider provider;
              std::printf("topo-lang-typescript find_package OK: language=%s glob=%s\n",
                          provider.languageName().c_str(),
                          provider.sourceFileGlob().c_str());
              return 0;
          }
          CPP
          cmake -S . -B build -G Ninja \
              -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/lang-typescript-install;${RUNNER_TEMP}/topo-install" \
              -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake"
          cmake --build build
          ./build/smoke
