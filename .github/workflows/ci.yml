name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel in-flight runs on the same ref when a new push lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin the upstream topo-core / topo-lang / topo-v8 refs this build is
  # tested against. Bump whenever a new compatible tag ships.
  TOPO_CORE_REF: main
  TOPO_LANG_REF: main
  TOPO_V8_REF: main

jobs:
  build-and-test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v5

      - name: Install build deps (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build

      - name: Install build deps (macos)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Set up Node.js 22 (for topo-extract-typescript + contract-pass tools)
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Export GHA cache env (for vcpkg x-gha backend)
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          # Matches the `builtin-baseline` pinned in vcpkg.json. Bump both
          # together when refreshing the vcpkg snapshot.
          vcpkgGitCommitId: "56bb2411609227288b70117ead2c47585ba07713"

      # Cache the upstream Topo install (topo-core + topo-lang + topo-v8)
      # so PRs don't re-build them every time. Keyed on the three pinned
      # refs so bumping any of them invalidates the cache.
      - name: Cache upstream topo install
        id: topo-cache
        uses: actions/cache@v5
        with:
          # Cache the staged topo-v8 contract-pass tools tree ALONGSIDE the
          # install prefix under the SAME key, so a cache hit restores BOTH.
          # Previously only topo-install was cached, so on a cache hit the
          # topo-v8-tools dir was absent and the transforms silently skipped.
          path: |
            ${{ runner.temp }}/topo-install
            ${{ runner.temp }}/topo-v8-tools
          key: topo-core-${{ env.TOPO_CORE_REF }}-lang-${{ env.TOPO_LANG_REF }}-v8-${{ env.TOPO_V8_REF }}-${{ matrix.os }}-v4

      - name: Build & install topo-core (zero-LLVM, lang-less)
        if: steps.topo-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${TOPO_CORE_REF}" \
              https://github.com/topo-lang/topo-core.git \
              "${RUNNER_TEMP}/topo-core-src"
          cmake -S "${RUNNER_TEMP}/topo-core-src" \
                -B "${RUNNER_TEMP}/topo-core-build" \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
                -DTOPO_ENABLE_LLVM=OFF
          cmake --build "${RUNNER_TEMP}/topo-core-build" --target install

      - name: Build & install topo-lang
        if: steps.topo-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${TOPO_LANG_REF}" \
              https://github.com/topo-lang/topo-lang.git \
              "${RUNNER_TEMP}/topo-lang-src"
          cmake -S "${RUNNER_TEMP}/topo-lang-src" \
                -B "${RUNNER_TEMP}/topo-lang-build" \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake"
          cmake --build "${RUNNER_TEMP}/topo-lang-build" --target install

      # Re-install topo-core to flip TOPO_CORE_WITH_LANG ON now that
      # topo-lang is discoverable in the prefix. This wires lib/Build +
      # lib/Transpile into the topo-core install set (V8Codegen depends
      # on TopoTranspile).
      - name: Re-install topo-core (with-lang)
        if: steps.topo-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S "${RUNNER_TEMP}/topo-core-src" \
                -B "${RUNNER_TEMP}/topo-core-build" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install"
          cmake --build "${RUNNER_TEMP}/topo-core-build" --target install

      - name: Build & install topo-v8
        if: steps.topo-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${TOPO_V8_REF}" \
              https://github.com/topo-lang/topo-v8.git \
              "${RUNNER_TEMP}/topo-v8-src"
          cmake -S "${RUNNER_TEMP}/topo-v8-src" \
                -B "${RUNNER_TEMP}/topo-v8-build" \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake"
          cmake --build "${RUNNER_TEMP}/topo-v8-build" --target install
          # Stash the topo-v8 source tools/ directory so topo-lang-typescript
          # can stage the Node contract-pass transforms. (The tools live in
          # topo-v8's source tree but aren't in its install set today.)
          mkdir -p "${RUNNER_TEMP}/topo-v8-tools"
          cp -R "${RUNNER_TEMP}/topo-v8-src/tools/." "${RUNNER_TEMP}/topo-v8-tools/"

      - name: Configure topo-lang-typescript
        run: |
          # The contract-pass tools are staged from topo-v8/tools and cached
          # alongside topo-install (same cache path), so the dir is present on
          # both cache hit and miss. On Linux/macOS we REQUIRE them: a missing
          # tools tree is a hard FAIL, not a silent skip (skip != pass).
          #
          # Windows is still skipped: the POST_BUILD `npm.cmd install` step
          # (topo-build/CMakeLists.txt) reproducibly fails exit 127 inside the
          # nested cmd.exe / vcpkg applocal.ps1 context — a tracked gap
          # (topo-lang-typescript Windows npm staging). Re-enable once fixed.
          REQUIRE_ARG=""
          TOOLS_ARG=""
          if [ "${{ runner.os }}" != "Windows" ]; then
            if [ ! -d "${RUNNER_TEMP}/topo-v8-tools/visibility-transform" ]; then
              echo "::error::topo-v8-tools missing (visibility-transform absent) — contract-pass transforms would silently skip"
              exit 1
            fi
            TOOLS_ARG="-DTOPO_V8_TOOLS_DIR=${RUNNER_TEMP}/topo-v8-tools"
            REQUIRE_ARG="-DTOPO_LANG_TYPESCRIPT_REQUIRE_CONTRACT_PASSES=ON"
          fi
          cmake -S . -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install" \
              -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
              -DTOPO_LANG_TYPESCRIPT_BUILD_TESTS=ON \
              ${TOOLS_ARG} ${REQUIRE_ARG}

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 120

      # Smoke test: install topo-lang-typescript, then verify a downstream
      # find_package(topo-lang-typescript CONFIG REQUIRED) resolves and
      # links cleanly against the topo::lang-typescript::TopoTypeScriptInit
      # target.
      - name: Install topo-lang-typescript
        run: cmake --install build --prefix "${RUNNER_TEMP}/lang-typescript-install"

      - name: find_package smoke
        run: |
          mkdir -p "${RUNNER_TEMP}/find-package-smoke"
          cd "${RUNNER_TEMP}/find-package-smoke"
          cat > vcpkg.json <<'JSON'
          {
            "name": "topo-lang-typescript-smoke",
            "version-string": "0.0.1",
            "builtin-baseline": "56bb2411609227288b70117ead2c47585ba07713",
            "dependencies": ["nlohmann-json", "tomlplusplus"]
          }
          JSON
          cat > CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.20)
          project(lang-typescript-find-package-smoke LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 17)
          find_package(topo-lang-typescript CONFIG REQUIRED)
          add_executable(smoke smoke.cpp)
          target_link_libraries(smoke PRIVATE topo::lang-typescript::TopoTypeScriptInit)
          if(MINGW)
              target_link_options(smoke PRIVATE -static -static-libgcc -static-libstdc++)
          endif()
          CMAKE
          cat > smoke.cpp <<'CPP'
          #include "TypeScriptInitTemplateProvider.h"
          #include <cstdio>
          int main() {
              topo::lang::TypeScriptInitTemplateProvider provider;
              std::printf("topo-lang-typescript find_package OK: language=%s glob=%s\n",
                          provider.languageName().c_str(),
                          provider.sourceFileGlob().c_str());
              return 0;
          }
          CPP
          cmake -S . -B build -G Ninja \
              -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/lang-typescript-install;${RUNNER_TEMP}/topo-install" \
              -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake"
          cmake --build build
          ./build/smoke
